; Read by PHP on Hostinger (LiteSpeed/PHP-FPM). Uploads allow photos and videos
; up to 50 MB each (see App\Models\ReportAttachment). If hPanel > PHP Options
; shows different values, the hPanel values win: raise them there instead.
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 20
memory_limit = 256M
expose_php = Off
display_errors = Off
